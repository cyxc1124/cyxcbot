services:
  cyxcbot:
    image: ghcr.io/cyxc1124/cyxcbot:v2.9.0
    container_name: cyxcbot
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./data:/app/data
      # 与协议端 / QQ 共享的媒体目录（须两边同路径挂载）。
      # 默认 data/tmp；与 LLBot 共用时挂 QQ 数据根，并在 Web Admin 设为 /root/.config/QQ/tmp。
      # - /path/to/shared/QQ:/root/.config/QQ
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      COMMAND_START: '["/"]'
      COMMAND_SEP: '["."]'
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8081"
      WEB_ADMIN_ENABLED: "true"
      # Required: export WEB_SECRET_KEY or put it in a .env next to this file.
      # Compose fails fast if unset; do not commit real secrets.
      WEB_SECRET_KEY: ${WEB_SECRET_KEY:?Set WEB_SECRET_KEY to a unique random string (>=32 chars)}
      SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:///data/cyxcbot.db
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
