# 检查对齐 GitHub PR。镜像用 Kaniko 推 GitLab Registry（K8s Runner 没有 Docker daemon）。
# Windows 包仍由 GitHub Actions 构建。
# 作业拉基础镜像走 Harbor 代理 harbor.cyxc.club（集群现网 chart 同样拉 harbor.cyxc.club/cyxc1124/cyxcbot）。
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v.+/

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  WEB_SECRET_KEY: ci-test-secret-key-not-for-production-use

stages:
  - test
  - build

python:
  stage: test
  image: python:3.14
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip
  before_script:
    - python -m pip install -r requirements.txt
  script:
    - ruff check .
    - ruff format --check .
    - pytest -v

web:
  stage: test
  image: node:22
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - .cache/npm
  before_script:
    - npm ci --prefix web
  script:
    - npm run lint --prefix web
    - npm run test --prefix web
    - npm run build --prefix web

# 无 Docker daemon：Kaniko 推 GitLab Registry。
# 构建代理：HTTP_PROXY / HTTPS_PROXY / NO_PROXY（不设则与 GitHub 一样直连）。
build:
  stage: build
  image:
    name: martizih/kaniko:v1.28.3-debug
    entrypoint: [""]
  interruptible: false
  timeout: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v.+/
  script:
    - /busybox/sh scripts/kaniko-build.sh
